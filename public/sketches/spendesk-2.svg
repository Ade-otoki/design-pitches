<svg xmlns="http://www.w3.org/2000/svg" width="520" height="340" viewBox="0 0 520 340" role="img" aria-label="Range 2 sketch: upload screen that pre-checks each document for date, ownership and signature"><title>Range 2 sketch: upload screen that pre-checks each document for date, ownership and signature</title><rect width="520" height="340" rx="18" fill="#ffffff"/><rect x="20" y="20" width="480" height="300" rx="12" fill="none" stroke="#26262b" stroke-width="2"/><line x1="20" y1="48" x2="500" y2="48" stroke="#26262b" stroke-width="2"/><circle cx="38" cy="34" r="4" fill="#9a9aa3"/><circle cx="52" cy="34" r="4" fill="#9a9aa3"/><circle cx="66" cy="34" r="4" fill="#9a9aa3"/><line x1="130" y1="48" x2="130" y2="320" stroke="#e9e9ee" stroke-width="2"/><rect x="36" y="70" width="70" height="8" rx="4" fill="#e9e9ee"/><rect x="36" y="92" width="70" height="8" rx="4" fill="#e9e9ee"/><rect x="36" y="114" width="70" height="8" rx="4" fill="#e9e9ee"/><rect x="36" y="136" width="70" height="8" rx="4" fill="#e9e9ee"/><rect x="36" y="158" width="80" height="8" rx="4" fill="#d8d4ea"/><rect x="36" y="180" width="70" height="8" rx="4" fill="#e9e9ee"/><text x="150" y="76" font-family="-apple-system,'Segoe UI',Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#26262b" text-anchor="start">Upload: Shareholding structure</text><rect x="150" y="92" width="330" height="54" rx="10" fill="none" stroke="#9a9aa3" stroke-width="1.5" stroke-dasharray="5 5"/><text x="315" y="124" font-family="-apple-system,'Segoe UI',Inter,Arial,sans-serif" font-size="11" font-weight="600" fill="#9a9aa3" text-anchor="middle">Drop file · checked instantly</text><rect x="150" y="160" width="330" height="24" rx="6" fill="#f6f6f8"/><text x="160" y="176" font-family="-apple-system,'Segoe UI',Inter,Arial,sans-serif" font-size="11" font-weight="600" fill="#3a984c" text-anchor="start">✓ Dated 2 Oct 2026, under 3 months</text><rect x="150" y="190" width="330" height="24" rx="6" fill="#f6f6f8"/><text x="160" y="206" font-family="-apple-system,'Segoe UI',Inter,Arial,sans-serif" font-size="11" font-weight="600" fill="#3a984c" text-anchor="start">✓ Shows 100% of shares</text><rect x="150" y="220" width="330" height="24" rx="6" fill="#fde9ea"/><text x="160" y="236" font-family="-apple-system,'Segoe UI',Inter,Arial,sans-serif" font-size="11" font-weight="600" fill="#c8313b" text-anchor="start">✕ No signature found: sign the last page</text><text x="150" y="278" font-family="'Bradley Hand','Segoe Print','Comic Sans MS','Chalkboard SE',cursive" font-size="15" font-weight="600" fill="#5d42d6" text-anchor="start">catches the usual rejections</text><text x="150" y="300" font-family="'Bradley Hand','Segoe Print','Comic Sans MS','Chalkboard SE',cursive" font-size="13" font-weight="600" fill="#9a9aa3" text-anchor="start">…but the owner still chases everyone</text></svg>