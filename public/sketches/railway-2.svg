<svg xmlns="http://www.w3.org/2000/svg" width="520" height="340" viewBox="0 0 520 340" role="img" aria-label="Range 2 sketch: CLI preflight check that probes the healthcheck path locally before deploying"><title>Range 2 sketch: CLI preflight check that probes the healthcheck path locally before deploying</title><rect width="520" height="340" rx="18" fill="#ffffff"/><rect x="20" y="20" width="480" height="300" rx="12" fill="#121318"/><rect x="20" y="20" width="480" height="26" rx="12" fill="#22242c"/><rect x="20" y="34" width="480" height="12" fill="#22242c"/><circle cx="36" cy="33" r="4" fill="#3a3d48"/><circle cx="50" cy="33" r="4" fill="#3a3d48"/><circle cx="64" cy="33" r="4" fill="#3a3d48"/><text x="40" y="72" font-family="ui-monospace,Menlo,monospace" font-size="13" font-weight="700" fill="#e8e9ed" text-anchor="start">$ railway preflight</text><text x="40" y="104" font-family="ui-monospace,Menlo,monospace" font-size="12" font-weight="600" fill="#4cc38a" text-anchor="start">✓ start command runs</text><text x="40" y="130" font-family="ui-monospace,Menlo,monospace" font-size="12" font-weight="600" fill="#4cc38a" text-anchor="start">✓ listening on $PORT 8080</text><text x="40" y="156" font-family="ui-monospace,Menlo,monospace" font-size="12" font-weight="600" fill="#f5b748" text-anchor="start">⚠ GET / → 308 redirect</text><text x="40" y="182" font-family="ui-monospace,Menlo,monospace" font-size="12" font-weight="600" fill="#f06a6a" text-anchor="start">✕ healthcheck would fail (needs 2xx)</text><text x="40" y="208" font-family="ui-monospace,Menlo,monospace" font-size="12" font-weight="600" fill="#b9bcc6" text-anchor="start">→ set healthcheck path to /api/health</text><text x="300" y="270" font-family="'Bradley Hand','Segoe Print','Comic Sans MS','Chalkboard SE',cursive" font-size="15" font-weight="600" fill="#ffb36b" text-anchor="start">catch it before pushing</text><text x="300" y="292" font-family="'Bradley Hand','Segoe Print','Comic Sans MS','Chalkboard SE',cursive" font-size="13" font-weight="600" fill="#9aa0ad" text-anchor="start">…but not env / DB / platform</text></svg>