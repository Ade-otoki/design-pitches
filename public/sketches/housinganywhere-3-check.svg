<svg xmlns="http://www.w3.org/2000/svg" width="402" height="874" viewBox="0 0 402 874" role="img" aria-label="Range 3, move-in day: countdown with a short room checklist"><title>Range 3, move-in day: countdown with a short room checklist</title><rect width="402" height="874" fill="#ffffff"/><text x="201.0" y="92" font-family="-apple-system,'Segoe UI',Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#002630" text-anchor="middle">Your stay</text><rect x="16" y="110" width="370" height="78" rx="14" fill="none" stroke="#e9e9ee" stroke-width="2"/><rect x="28" y="122" width="54" height="54" rx="10" fill="#e9e9ee"/><rect x="96" y="132" width="170" height="11" rx="4" fill="#cfd8de"/><rect x="96" y="152" width="210" height="8" rx="4" fill="#e9e9ee"/><rect x="96" y="166" width="140" height="8" rx="4" fill="#e9e9ee"/><rect x="16" y="204" width="370" height="86" rx="14" fill="#002630"/><circle cx="58" cy="247" r="24" fill="none" stroke="#ff4c27" stroke-width="4"/><text x="58" y="252" font-family="-apple-system,'Segoe UI',Inter,Arial,sans-serif" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">45h</text><text x="96" y="252" font-family="-apple-system,'Segoe UI',Inter,Arial,sans-serif" font-size="16" font-weight="800" fill="#fff" text-anchor="start">Check your room</text><rect x="16" y="304" width="370" height="340" rx="14" fill="none" stroke="#e9e9ee" stroke-width="2"/><text x="32" y="336" font-family="-apple-system,'Segoe UI',Inter,Arial,sans-serif" font-size="16" font-weight="800" fill="#002630" text-anchor="start">Move-in check</text><text x="370" y="336" font-family="-apple-system,'Segoe UI',Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#9a9aa3" text-anchor="end">4/5</text><circle cx="44" cy="374" r="12" fill="#3a984c" stroke="#3a984c" stroke-width="2"/><text x="66" y="379" font-family="-apple-system,'Segoe UI',Inter,Arial,sans-serif" font-size="14" font-weight="600" fill="#26262b" text-anchor="start">Got the keys</text><circle cx="44" cy="418" r="12" fill="#3a984c" stroke="#3a984c" stroke-width="2"/><text x="66" y="423" font-family="-apple-system,'Segoe UI',Inter,Arial,sans-serif" font-size="14" font-weight="600" fill="#26262b" text-anchor="start">Matches the listing</text><circle cx="44" cy="462" r="12" fill="#3a984c" stroke="#3a984c" stroke-width="2"/><text x="66" y="467" font-family="-apple-system,'Segoe UI',Inter,Arial,sans-serif" font-size="14" font-weight="600" fill="#26262b" text-anchor="start">Clean and safe</text><circle cx="44" cy="506" r="12" fill="#fff" stroke="#a5bccc" stroke-width="2"/><text x="66" y="511" font-family="-apple-system,'Segoe UI',Inter,Arial,sans-serif" font-size="14" font-weight="600" fill="#26262b" text-anchor="start">Heating and hot water</text><circle cx="44" cy="550" r="12" fill="#3a984c" stroke="#3a984c" stroke-width="2"/><text x="66" y="555" font-family="-apple-system,'Segoe UI',Inter,Arial,sans-serif" font-size="14" font-weight="600" fill="#26262b" text-anchor="start">Wi-Fi works</text><rect x="32" y="586" width="160" height="44" rx="10" fill="none" stroke="#002630" stroke-width="2"/><text x="112" y="613" font-family="-apple-system,'Segoe UI',Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#002630" text-anchor="middle">Something's wrong</text><rect x="204" y="586" width="166" height="44" rx="10" fill="#ffc2b5"/><text x="287" y="613" font-family="-apple-system,'Segoe UI',Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">All good, release</text><rect x="25" y="579" width="174" height="58" rx="16" fill="none" stroke="#c2410c" stroke-width="2.5" stroke-dasharray="7 6"/><text x="24" y="700" font-family="'Bradley Hand','Segoe Print','Comic Sans MS','Chalkboard SE',cursive" font-size="20" font-weight="600" fill="#ff4c27" text-anchor="start">a checklist inside the window</text><line x1="0" y1="790" x2="402" y2="790" stroke="#e9e9ee" stroke-width="2"/><rect x="30" y="806" width="36" height="8" rx="4" fill="