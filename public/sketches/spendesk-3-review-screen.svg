80" r="9" fill="#26262b" stroke="#26262b" stroke-width="3"/><line x1="420" y1="292" x2="420" y2="344" stroke="#e9e9ee" stroke-width="3"/><text x="446" y="286" font-family="-apple-system,'Segoe UI',Inter,Arial,sans-serif" font-size="18" font-weight="800" fill="#26262b" text-anchor="start">Sent for review</text><text x="446" y="310" font-family="-apple-system,'Segoe UI',Inter,Arial,sans-serif" font-size="14" font-weight="500" fill="#6b6b73" text-anchor="start">By Marie Laurent · 6 of 6 items passed our checks</text><text x="330" y="362" font-family="-apple-system,'Segoe UI',Inter,Arial,sans-serif" font-size="14" font-weight="600" fill="#9a9aa3" text-anchor="start">13 Nov</text><circle cx="420" cy="356" r="9" fill="#fff" stroke="#5d42d6" stroke-width="3"/><line x1="420" y1="368" x2="420" y2="420" stroke="#e9e9ee" stroke-width="3"/><text x="446" y="362" font-family="-apple-system,'Segoe UI',Inter,Arial,sans-serif" font-size="18" font-weight="800" fill="#5d42d6" text-anchor="start">In review</text><text x="446" y="386" font-family="-apple-system,'Segoe UI',Inter,Arial,sans-serif" font-size="14" font-weight="500" fill="#6b6b73" text-anchor="start">Our compliance team is checking. Usually 2 working days.</text><text x="330" y="438" font-family="-apple-system,'Segoe UI',Inter,Arial,sans-serif" font-size="14" font-weight="600" fill="#9a9aa3" text-anchor="start">17 Nov</text><circle cx="420" cy="432" r="9" fill="#fff" stroke="#9a9aa3" stroke-width="3"/><text x="446" y="438" font-family="-apple-system,'Segoe UI',Inter,Arial,sans-serif" font-size="18" font-weight="800" fill="#9a9aa3" text-anchor="start">Decision expected</text><text x="446" y="462" font-family="-apple-system,'Segoe UI',Inter,Arial,sans-serif" font-size="14" font-weight="500" fill="#6b6b73" text-anchor="start">We'll email you and update this page.</text><text x="300" y="552" font-family="-apple-system,'Segoe UI',Inter,Arial,sans-serif" font-size="16" font-weight="800" fill="#26262b" text-anchor="start">What you 