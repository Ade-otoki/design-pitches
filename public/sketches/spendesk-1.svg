<svg xmlns="http://www.w3.org/2000/svg" width="520" height="340" viewBox="0 0 520 340" role="img" aria-label="Range 1 sketch: a clearer KYC email with a document checklist and the rules spelled out"><title>Range 1 sketch: a clearer KYC email with a document checklist and the rules spelled out</title><rect width="520" height="340" rx="18" fill="#ffffff"/><rect x="20" y="20" width="480" height="300" rx="12" fill="none" stroke="#26262b" stroke-width="2"/><line x1="20" y1="48" x2="500" y2="48" stroke="#26262b" stroke-width="2"/><circle cx="38" cy="34" r="4" fill="#9a9aa3"/><circle cx="52" cy="34" r="4" fill="#9a9aa3"/><circle cx="66" cy="34" r="4" fill="#9a9aa3"/><text x="40" y="74" font-family="-apple-system,'Segoe UI',Inter,Arial,sans-serif" font-size="11" font-weight="600" fill="#9a9aa3" text-anchor="start">From: collect@spendesk.com</text><text x="40" y="96" font-family="-apple-system,'Segoe UI',Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#26262b" text-anchor="start">Action needed: your periodic KYC review</text><rect x="40" y="112" width="400" height="7" rx="4" fill="#e9e9ee"/><rect x="40" y="126" width="280" height="7" rx="4" fill="#e9e9ee"/><rect x="40" y="148" width="300" height="112" rx="10" fill="none" stroke="#5d42d6" stroke-width="2"/><text x="54" y="172" font-family="-apple-system,'Segoe UI',Inter,Arial,sans-serif" font-size="11" font-weight="500" fill="#26262b" text-anchor="start">☐ Kbis, under 3 months old</text><text x="54" y="196" font-family="-apple-system,'Segoe UI',Inter,Arial,sans-serif" font-size="11" font-weight="500" fill="#26262b" text-anchor="start">☐ Shareholding: signed + dated</text><text x="54" y="220" font-family="-apple-system,'Segoe UI',Inter,Arial,sans-serif" font-size="11" font-weight="500" fill="#26262b" text-anchor="start">☐ IDs in colour, front and back</text><text x="54" y="244" font-family="-apple-system,'Segoe UI',Inter,Arial,sans-serif" font-size="11" font-weight="500" fill="#26262b" text-anchor="start">☐ Proof of address &lt; 3 months</text><text x="356" y="176" font-family="'Bradley Hand','Segoe Print','Comic Sans MS','Chalkboard SE',cursive" font-size="15" font-weight="600" fill="#5d42d6" text-anchor="start">clear list +</text><text x="356" y="196" font-family="'Bradley Hand','Segoe Print','Comic Sans MS','Chalkboard SE',cursive" font-size="15" font-weight="600" fill="#5d42d6" text-anchor="start">examples</text><text x="40" y="296" font-family="'Bradley Hand','Segoe Print','Comic Sans MS','Chalkboard SE',cursive" font-size="13" font-weight="600" fill="#9a9aa3" text-anchor="start">still email-only · still rejected after 48h</text></svg>