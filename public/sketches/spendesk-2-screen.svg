<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-label="Range 2: upload page that checks each document straight away, with a missing signature flagged"><title>Range 2: upload page that checks each document straight away, with a missing signature flagged</title><rect width="1280" height="800" fill="#ffffff"/><rect x="0" y="0" width="240" height="800" fill="#f6f6f8"/><line x1="240" y1="0" x2="240" y2="800" stroke="#e9e9ee" stroke-width="2"/><rect x="24" y="26" width="36" height="36" rx="8" fill="#e9e9ee"/><rect x="72" y="32" width="110" height="11" rx="4" fill="#d6d6dc"/><rect x="72" y="50" width="70" height="8" rx="4" fill="#e9e9ee"/><rect x="30" y="109" width="16" height="16" rx="4" fill="#dcdce2"/><text x="60" y="123" font-family="-apple-system,'Segoe UI',Inter,Arial,sans-serif" font-size="16" font-weight="500" fill="#55555f" text-anchor="start">Home</text><rect x="30" y="155" width="16" height="16" rx="4" fill="#dcdce2"/><text x="60" y="169" font-family="-apple-system,'Segoe UI',Inter,Arial,sans-serif" font-size="16" font-weight="500" fill="#55555f" text-anchor="start">Requests</text><rect x="30" y="201" width="16" height="16" rx="4" fill="#dcdce2"/><text x="60" y="215" font-family="-apple-system,'Segoe UI',Inter,Arial,sans-serif" font-size="16" font-weight="500" fill="#55555f" text-anchor="start">Expenses</text><rect x="30" y="247" width="16" height="16" rx="4" fill="#dcdce2"/><text x="60" y="261" font-family="-apple-system,'Segoe UI',Inter,Arial,sans-serif" font-size="16" font-weight="500" fill="#55555f" text-anchor="start">Cards</text><rect x="30" y="293" width="16" height="16" rx="4" fill="#dcdce2"/><text x="60" y="307" font-family="-apple-system,'Segoe UI',Inter,Arial,sans-serif" font-size="16" font-weight="500" fill="#55555f" text-anchor="start">Invoices</text><rect x="30" y="339" width="16" height="16" rx="4" fill="#dcdce2"/><text x="60" y="353" font-family="-apple-system,'Segoe UI',Inter,Arial,sans-serif" font-size="16" font-weight="500" fill="#55555f" text-anchor="start">Bookkeeping</text><rect x="14" y="374" width="212" height="40" rx="9" fill="#ebe8f7"/><rect x="30" y="385" width="16" height="16" rx="4" fill="#c9c1ee"/><text x="60" y="399" font-family="-apple-system,'Segoe UI',Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#26262b" text-anchor="start">Verification</text><rect x="30" y="431" width="16" height="16" rx="4" fill="#dcdce2"/><text x="60" y="445" font-family="-apple-system,'Segoe UI',Inter,Arial,sans-serif" font-size="16" font-weight="500" fill="#55555f" text-anchor="start">Settings</text><text x="300" y="66" font-family="-apple-system,'Segoe UI',Inter,Arial,sans-serif" font-size="15" font-weight="500" fill="#9a9aa3" text-anchor="start">Verification  ›  Shareholding structure</text><text x="300" y="110" font-family="-apple-system,'Segoe UI',Inter,Arial,sans-serif" font-size="30" font-weight="800" fill="#26262b" text-anchor="start">Upload your shareholding structure</text><text x="300" y="142" font-family="-apple-system,'Segoe UI',Inter,Arial,sans-serif" font-size="16" font-weight="500" fill="#6b6b73" text-anchor="start">Signed and dated by a legal representative, under 3 months old.</text><rect x="300" y="174" width="620" height="150" rx="14" fill="none" stroke="#9a9aa3" stroke-width="2" stroke-dasharray="9 8"/><rect x="590" y="206" width="40" height="40" rx="10" fill="#e9e9ee"/><text x="610" y="278" font-family="-apple-system,'Segoe UI',Inter,Arial,sans-serif" font-size="16" font-weight="600" fill="#6b6b73" text-anchor="middle">Drop your file here  ·  we check it straight away</text><rect x="300" y="350" width="620" height="64" rx="12" fill="none" stroke="#e9e9ee" stroke-width="2"/><rect x="318" y="366" width="32" height="32" rx="7" fill="#fde9ea"/><text x="366" y="380" font-family="-apple-system,'Segoe UI',Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#26262b" text-anchor="start">Cap-table_Northwind.pdf</text><text x="366" y="400" font-family="-apple-system,'Segoe UI',Inter,Arial,sans-serif" font-size="13" font-weight="500" fill="#9a9aa3" text-anchor="start">Uploaded just now · 1 page</text><text x="300" y="456" font-family="-apple-system,'Segoe UI',Inter,Arial,sans-serif" font-size="18" font-weight="800" fill="#26262b" text-anchor="start">Automatic checks</text><rect x="300" y="476" width="620" height="48" rx="10" fill="#f4f8f4"/><text x="318" y="506" font-family="-apple-system,'Segoe UI',Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#3a984c" text-anchor="start">✓  Dated 2 Oct 2026, under 3 months</text><rect x="300" y="536" width="620" height="48" rx="10" fill="#f4f8f4"/><text x="318" y="566" font-family="-apple-system,'Segoe UI',Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#3a984c" text-anchor="start">✓  Shows who owns 100% of the shares</text><rect x="300" y="596" width="620" height="48" rx="10" fill="#fde9ea"/><text x="318" y="626" font-family="-apple-system,'Segoe UI',Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#c8313b" text-anchor="start">✕  No signature found. Sign and date the last page, then upload it again.</text><text x="960" y="520" font-family="'Bradley Hand','Segoe Print','Comic Sans MS','Chalkboard SE',cursive" font-size="26" font-weight="600" fill="#5d42d6" text-anchor="start">catches the usual</text><text x="960" y="554" font-family="'Bradley Hand','Segoe Print','Comic Sans MS','Chalkboard SE',cursive" font-size="26" font-weight="600" fill="#5d42d6" text-anchor="start">rejections at upload</text><path d="M956,540 Q948.1,560.9 930,574" fill="none" stroke="#5d42d6" stroke-width="2" stroke-linecap="round"/><path d="M931.8,565.2 L930,574 L938.0,569.9" fill="none" stroke="#5d42d6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="300" y="740" font-family="'Bradley Hand','Segoe Print','Comic Sans MS','Chalkboard SE',cursive" font-size="22" font-weight="600" fill="#8a8a93" text-anchor="start">…but the Account Owner still chases every shareholder, and gets no status after sending</text></svg>