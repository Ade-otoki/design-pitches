<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-label="Range 1: show which template the agent picked, as a line in the chat"><title>Range 1: show which template the agent picked, as a line in the chat</title><rect width="1280" height="800" fill="#ffffff"/><rect x="0" y="0" width="240" height="800" fill="#f6f6f8"/><line x1="240" y1="0" x2="240" y2="800" stroke="#e9e9ee" stroke-width="2"/><rect x="24" y="26" width="36" height="36" rx="8" fill="#e9e9ee"/><rect x="72" y="32" width="110" height="11" rx="4" fill="#d6d6dc"/><rect x="72" y="50" width="70" height="8" rx="4" fill="#e9e9ee"/><rect x="14" y="98" width="212" height="40" rx="9" fill="#ebe8f7"/><rect x="30" y="109" width="16" height="16" rx="4" fill="#c9c1ee"/><text x="60" y="123" font-family="-apple-system,'Segoe UI',Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#26262b" text-anchor="start">Agents</text><rect x="30" y="155" width="16" height="16" rx="4" fill="#dcdce2"/><text x="60" y="169" font-family="-apple-system,'Segoe UI',Inter,Arial,sans-serif" font-size="16" font-weight="500" fill="#55555f" text-anchor="start">Workspaces</text><rect x="30" y="201" width="16" height="16" rx="4" fill="#dcdce2"/><text x="60" y="215" font-family="-apple-system,'Segoe UI',Inter,Arial,sans-serif" font-size="16" font-weight="500" fill="#55555f" text-anchor="start">Templates</text><rect x="30" y="247" width="16" height="16" rx="4" fill="#dcdce2"/><text x="60" y="261" font-family="-apple-system,'Segoe UI',Inter,Arial,sans-serif" font-size="16" font-weight="500" fill="#55555f" text-anchor="start">Users</text><rect x="30" y="293" width="16" height="16" rx="4" fill="#dcdce2"/><text x="60" y="307" font-family="-apple-system,'Segoe UI',Inter,Arial,sans-serif" font-size="16" font-weight="500" fill="#55555f" text-anchor="start">Audit</text><rect x="30" y="339" width="16" height="16" rx="4" fill="#dcdce2"/><text x="60" y="353" font-family="-apple-system,'Segoe UI',Inter,Arial,sans-serif" font-size="16" font-weight="500" fill="#55555f" text-anchor="start">Deployment</text><rect x="30" y="385" width="16" height="16" rx="4" fill="#dcdce2"/><text x="60" y="399" font-family="-apple-system,'Segoe UI',Inter,Arial,sans-serif" font-size="16" font-weight="500" fill="#55555f" text-anchor="start"></text><rect x="30" y="431" width="16" height="16" rx="4" fill="#dcdce2"/><text x="60" y="445" font-family="-apple-system,'Segoe UI',Inter,Arial,sans-serif" font-size="16" font-weight="500" fill="#55555f" text-anchor="start"></text><text x="300" y="80" font-family="-apple-system,'Segoe UI',Inter,Arial,sans-serif" font-size="26" font-weight="800" fill="#26262b" text-anchor="start">Fix refund rounding bug</text><rect x="760" y="110" width="400" height="44" rx="10" fill="#ececf0"/><rect x="780" y="128" width="300" height="9" rx="4" fill="#cfcfd8"/><rect x="300" y="180" width="420" height="9" rx="4" fill="#e9e9ee"/><rect x="300" y="198" width="300" height="9" rx="4" fill="#e9e9ee"/><rect x="300" y="230" width="860" height="60" rx="10" fill="none" stroke="#e9e9ee" stroke-width="2"/><text x="320" y="266" font-family="-apple-system,'Segoe UI',Inter,Arial,sans-serif" font-size="15" font-weight="600" fill="#26262b" text-anchor="start">Workspace: python-payments (picked by agent)</text><rect x="289" y="219" width="882" height="82" rx="16" fill="none" stroke="#c2410c" stroke-width="2.5" stroke-dasharray="7 6"/><text x="300" y="360" font-family="'Bradley Hand','Segoe Print','Comic Sans MS','Chalkboard SE',cursive" font-size="24" font-weight="600" fill="#5d42d6" text-anchor="start">name the template the agent picked</text><text x="300" y="400" font-family="'Bradley Hand','Segoe Print','Comic Sans MS','Chalkboard SE',cursive" font-size="22" font-weight="600" fill="#8a8a93" text-anchor="start">…but you can only change it after it starts</text></svg>